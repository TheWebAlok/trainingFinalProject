<!-- Global Spinner -->
<ngx-spinner
  bdColor="rgba(51,51,51,0.8)"
  size="medium"
  color="#fff"
  type="ball-scale-multiple"
>
  <p style="font-size: 20px; color: white">Loading...</p>
</ngx-spinner>
<div class="container ">
  <h2 class="text-center mb-4">Contact Us</h2>

  <form class="needs-validation" novalidate (ngSubmit)="submit()">

    <div class="mb-3">
      <label for="name" class="form-label">Your Name:</label>
      <input type="text" class="form-control" id="name" name="name"
        [(ngModel)]="name" placeholder="Enter your name" required />
      <div class="invalid-feedback">
        Please enter your name.
      </div>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Your Email:</label>
      <input type="email" class="form-control" id="email" name="email"
        [(ngModel)]="email" placeholder="Enter your email" required />
      <div class="invalid-feedback">
        Please enter a valid email address.
      </div>
    </div>
    <div class="mb-3">
      <label for="message" class="form-label">Your Message:</label>
      <textarea id="message" class="form-control" name="message"
        [(ngModel)]="message" placeholder="Write your message here"
        required></textarea>
      <div class="invalid-feedback">
        Please write your message.
      </div>
    </div>
    <button type="submit" class="btn btn-outline-success w-100">Submit</button>
  </form>
</div>
