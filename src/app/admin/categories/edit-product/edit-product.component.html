
<div class="container animate__animated animate__fadeIn">
  <div class="row justify-content-center">
    <div
      class="col-md-10 mt-4 mb-5form-box">

      <h2
        class="text-center mb-4 animate__animated animate__slideInLeft text-warning fw-bold">
        Edit Product
      </h2>

      <form [formGroup]="productForm" (ngSubmit)="submitProduct()"
        class="animate__animated animate__slideInRight">

        <div class="row">
          <div class="col-md-6">

            <div class="mb-3 group-hover">
              <label class="form-label">Product Name</label>
              <input type="text" class="form-control input-hover"
                formControlName="name" placeholder="Enter product name">
            </div>

            <div class="mb-3 group-hover">
              <label class="form-label">Brand</label>
              <input type="text" class="form-control input-hover"
                formControlName="brand" placeholder="Enter brand name">
            </div>

            <div class="mb-3 group-hover">
              <label class="form-label">Price (₹)</label>
              <input type="number" class="form-control input-hover"
                formControlName="price" placeholder="Enter price">
            </div>

            <div class="mb-3 group-hover">
              <label class="form-label">Stock</label>
              <input type="number" class="form-control input-hover"
                formControlName="stock" placeholder="Enter stock quantity">
            </div>

          </div>

          <div class="col-md-6">

            <div class="mb-3 group-hover">
              <label class="form-label">Category ID</label>
              <input type="text" class="form-control input-hover"
                formControlName="categoryId" placeholder="Enter category ID">
            </div>

            <div class="mb-3 group-hover">
              <label class="form-label">Category Name</label>
              <input type="text" class="form-control input-hover"
                formControlName="categoryName"
                placeholder="Enter category name">
            </div>

            <div class="mb-3 group-hover">
              <label class="form-label">Description</label>
              <textarea class="form-control input-hover" rows="3"
                formControlName="description"
                placeholder="Enter description"></textarea>
            </div>

            <div class="mb-3 group-hover">
              <label class="form-label">Product Image</label>
              <input type="file" class="form-control input-hover"
                (change)="uploadFile($event)">
            </div>

          </div>
        </div>

        <div class="mb-3 mt-3">
          <button type="submit"
            class="btn btn-warning w-100 transition-all fw-semibold"
            [disabled]="productForm.invalid">
            Update Product
          </button>
        </div>

        <p class="mt-3 text-center">
          Go back to <a routerLink="/admin/dashboard">Dashboard</a>
        </p>

      </form>
    </div>
  </div>
</div>
