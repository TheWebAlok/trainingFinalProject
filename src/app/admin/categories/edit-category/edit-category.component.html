<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 mt-4 mb-5">
      <h2 class="text-center mb-4">Edit Category</h2>

      <form #categoryForm="ngForm" (ngSubmit)="submitCategory(categoryForm)">

        <div class="mb-3">
          <label class="form-label">Category Name</label>
          <input type="text" class="form-control"
            [(ngModel)]="category.name" name="name" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Company Name</label>
          <input type="text" class="form-control"
            [(ngModel)]="category.company" name="company" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Price (₹)</label>
          <input type="number" class="form-control"
            [(ngModel)]="category.price" name="price" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Warranty (months)</label>
          <input type="number" class="form-control"
            [(ngModel)]="category.warranty" name="warranty">
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea class="form-control" rows="3"
            [(ngModel)]="category.description" name="description"></textarea>
        </div>

        @if (category.imageUrl) {
        <div class="mb-3">
          <label class="form-label">Current Image</label><br>
          <img [src]="category.imageUrl" alt="Category Image" width="120"
            class="mb-2">
        </div>
        }

        <div class="mb-3">
          <label class="form-label">Change Image</label>
          <input type="file" class="form-control" (change)="uploadFile($event)">
        </div>

        <button type="submit" class="btn btn-success w-100"
          [disabled]="categoryForm.invalid">
          Save Changes
        </button>

        <p class="mt-3 text-center">
          Go back to <a routerLink="/admin/dashboard">Dashboard</a>
        </p>
      </form>
    </div>
  </div>
</div>
