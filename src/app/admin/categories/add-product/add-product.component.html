<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8 border p-4 rounded ">

      <h2 class="text-center mb-4 text-primary">Add Product</h2>

      <form (ngSubmit)="submitProduct()">

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Product Name</label>
            <input type="text" class="form-control"
              [(ngModel)]="productObj.name" name="name">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Brand</label>
            <input type="text" class="form-control"
              [(ngModel)]="productObj.brand" name="brand">
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Price (₹)</label>
            <input type="number" class="form-control"
              [(ngModel)]="productObj.price" name="price">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Stock</label>
            <input type="number" class="form-control"
              [(ngModel)]="productObj.stock" name="stock">
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Choose Category</label>
            <select class="form-control" [(ngModel)]="productObj.categoryId"
              name="categoryId">
              <option disabled selected value>Choose Category</option>
              @for (c of categories; track c.id) {
              <option [value]="c.id">{{c.name}}</option>
              }
            </select>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Product Image</label>
            <input type="file" class="form-control"
              (change)="uploadFile($event)">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea class="form-control" rows="3"
            [(ngModel)]="productObj.description" name="description"></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">Add Product</button>
      </form>

      <p class="mt-3 text-center">
        Go back to <a routerLink="/admin/dashboard">Dashboard</a>
      </p>
    </div>
  </div>
</div>
