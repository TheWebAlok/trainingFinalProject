<div class="container mt-5">
  <div class="card shadow-lg p-4 rounded-3">
    <h3 class="text-center text-success mb-4">Add Lamination Service</h3>

    <form #liminationForm="ngForm" (ngSubmit)="submitLimination(liminationForm)">
      <div class="row g-3">

        <div class="col-md-6">
          <label class="form-label fw-bold">Service Name</label>
          <input type="text" class="form-control" name="serviceName"
                 [(ngModel)]="limination.serviceName" required />
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold">Choose Category</label>
          <select class="form-select" [(ngModel)]="limination.categoryId" name="categoryId"
                  (change)="selectCategory($event)" required>
            <option disabled selected value>-- Select Category --</option>
            @for (c of categories; track c.id) {
              <option [value]="c.id">{{c.name}}</option>
            }
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold">Price (₹)</label>
          <input type="number" class="form-control" name="price"
                 [(ngModel)]="limination.price" required />
        </div>

        <div class="col-12">
          <label class="form-label fw-bold">Description</label>
          <textarea class="form-control" name="description"
                    [(ngModel)]="limination.description"
                    rows="3"></textarea>
        </div>

        <div class="col-12">
          <label class="form-label fw-bold">Upload Image</label>
          <input type="file" class="form-control" (change)="onFileSelected($event)" />
        </div>

        <div class="col-12">
          <button type="submit" class="btn btn-success w-100 mt-3"
                  [disabled]="liminationForm.invalid || uploading">
            {{ uploading ? 'Uploading...' : 'Save Service' }}
          </button>
        </div>

      </div>
    </form>
  </div>
</div>
