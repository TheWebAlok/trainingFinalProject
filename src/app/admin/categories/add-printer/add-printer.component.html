<div class="container mt-4">
  <h3 class="mb-3">Add Printer</h3>

  <form #printerForm="ngForm" (ngSubmit)="submitPrinter(printerForm)">
    <div class="row">
      <!-- Printer Name -->
      <div class="col-md-6 mb-3">
        <label class="form-label">Printer Name</label>
        <input
          type="text"
          class="form-control"
          name="name"
          [(ngModel)]="printerObj.name"
          required />
      </div>

      <!-- Category -->
      <div class="col-md-6 mb-3">
        <label class="form-label">Choose Category</label>
        <select
          class="form-control"
          [(ngModel)]="printerObj.categoryId"
          name="categoryId">
          <option disabled selected value>Choose Category</option>
          @for (c of categories; track c.id) {
            <option [value]="c.id">{{ c.name }}</option>
          }
        </select>
      </div>
    </div>

    <div class="row">
      <!-- Brand -->
      <div class="col-md-6 mb-3">
        <label class="form-label">Brand</label>
        <input
          type="text"
          class="form-control"
          name="brand"
          [(ngModel)]="printerObj.brand"
          required />
      </div>

      <!-- Price -->
      <div class="col-md-3 mb-3">
        <label class="form-label">Price</label>
        <input
          type="number"
          class="form-control"
          name="price"
          [(ngModel)]="printerObj.price"
          required />
      </div>

      <!-- Stock -->
      <div class="col-md-3 mb-3">
        <label class="form-label">Stock</label>
        <input
          type="number"
          class="form-control"
          name="stock"
          [(ngModel)]="printerObj.stock"
          required />
      </div>
    </div>

    <div class="row">
      <!-- Description -->
      <div class="col-md-12 mb-3">
        <label class="form-label">Description</label>
        <textarea
          class="form-control"
          name="description"
          [(ngModel)]="printerObj.description"
          rows="3"></textarea>
      </div>
    </div>

    <div class="row">
      <!-- Image Upload -->
      <div class="col-md-12 mb-3">
        <label class="form-label">Upload Image</label>
        <input type="file" class="form-control" (change)="uploadFile($event)" />
      </div>
    </div>

    <div class="row">
      <div class="col-md-12">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="printerForm.invalid">
          Save Printer
        </button>
      </div>
    </div>
  </form>
</div>
