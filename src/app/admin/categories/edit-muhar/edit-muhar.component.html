<div class="container mt-4">
  <div class="card shadow-lg p-4 rounded-3">
    <h2 class="text-center text-success mb-4">Edit Muhar</h2>

    <div *ngIf="loading" class="text-center text-secondary">Loading...</div>

    <form *ngIf="!loading" (ngSubmit)="onUpdate()" #editForm="ngForm">
      <div class="row g-3">

        <!-- Type -->
        <div class="col-md-6">
          <label class="form-label fw-bold">Type</label>
          <input type="text" class="form-control" [(ngModel)]="muhar.type" name="type" required />
        </div>

        <!-- Text -->
        <div class="col-md-6">
          <label class="form-label fw-bold">Text</label>
          <input type="text" class="form-control" [(ngModel)]="muhar.text" name="text" required />
        </div>

        <!-- Price -->
        <div class="col-md-6">
          <label class="form-label fw-bold">Price (₹)</label>
          <input type="number" class="form-control" [(ngModel)]="muhar.price" name="price" required />
        </div>

        <!-- Image Upload -->
        <div class="col-md-6">
          <label class="form-label fw-bold">Change Image</label>
          <input type="file" class="form-control" (change)="onFileSelected($event)" />
        </div>

        <!-- Preview -->
        <div class="col-md-12 text-center mt-3">
          <img
            *ngIf="previewUrl"
            [src]="previewUrl"
            alt="Preview"
            class="img-fluid rounded shadow"
            style="max-height: 200px;"
          />
        </div>

        <!-- Status -->
        <div class="col-12">
          <div class="form-check mt-2">
            <input type="checkbox" class="form-check-input" [(ngModel)]="muhar.status" name="status" />
            <label class="form-check-label fw-bold">Active</label>
          </div>
        </div>

        <!-- Submit -->
        <div class="col-12">
          <button type="submit" class="btn btn-success w-100 mt-3" [disabled]="editForm.invalid">
            Update Muhar
          </button>
        </div>

      </div>
    </form>
  </div>
</div>
