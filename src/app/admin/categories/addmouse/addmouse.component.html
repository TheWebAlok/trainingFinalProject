<div class="container mt-3">
  <h2 class="mb-4 text-center">Add New Mouse</h2>

  <form (ngSubmit)="addMouse()" #mouseForm="ngForm">
    <div class="row">
      <!-- Name -->
      <div class="col-md-6 mb-3">
        <label class="form-label">Name</label>
        <input type="text" [(ngModel)]="mouse.name" name="name"
          class="form-control" required>
      </div>

      <!-- Category -->
      <div class="col-md-6 mb-3">
        <label class="form-label">Choose Category</label>
        <select class="form-control" [(ngModel)]="mouse.categoryId"
          name="categoryId">
          <option disabled selected value>Choose Category</option>
          @for (c of categories; track c.id) {
          <option [value]="c.id">{{c.name}}</option>
          }
        </select>
      </div>

      <!-- Brand -->
      <div class="col-md-6 mb-3">
        <label class="form-label">Brand</label>
        <input type="text" [(ngModel)]="mouse.brand" name="brand"
          class="form-control" required>
      </div>

      <!-- Type -->
      <div class="col-md-6 mb-3">
        <label class="form-label">Type</label>
        <select [(ngModel)]="mouse.type" name="type" class="form-control"
          required>
          <option value="wired">Wired</option>
          <option value="wireless">Wireless</option>
        </select>
      </div>

      <!-- Price -->
      <div class="col-md-6 mb-3">
        <label class="form-label">Price</label>
        <input type="number" [(ngModel)]="mouse.price" name="price"
          class="form-control" required>
      </div>

      <!-- Stock -->
      <div class="col-md-6 mb-3">
        <label class="form-label">Stock</label>
        <input type="number" [(ngModel)]="mouse.stock" name="stock"
          class="form-control" required>
      </div>

      <!-- Description -->
      <div class="col-12 mb-3">
        <label class="form-label">Description</label>
        <textarea [(ngModel)]="mouse.description" name="description"
          class="form-control" rows="3"></textarea>
      </div>

      <!-- Image Upload -->
      <div class="col-12 mb-3">
        <label class="form-label">Image</label>
        <input type="file" (change)="onFileSelected($event)"
          class="form-control">
      </div>

      <!-- Submit -->
      <div class="col-12">
        <button type="submit" class="btn btn-primary w-100"
          [disabled]="uploading">
          {{ uploading ? 'Uploading...' : 'Add Mouse' }}
        </button>
      </div>
    </div>
  </form>
</div>
