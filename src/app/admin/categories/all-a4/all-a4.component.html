<div class="container mt-3">
  <h3>A4 Papers</h3>

  @if (allA4.length === 0) {
    <div class="alert alert-warning text-center">
      No A4 papers found.
    </div>
  }

  <div class="row g-3">
    @for (item of allA4; track item.id) {
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card p-2 shadow-sm h-100">
          <img [src]="item.imageUrl || 'assets/images/no-image.png'"
               alt="A4 Image"
               class="img-fluid mb-2"
               style="max-height: 120px; width: 100%; object-fit: cover;">

          <h6 class="mb-1">{{ item.name }}</h6>
          <p class="mb-1"><strong>Description:</strong> {{ item.description }}</p>
          <p class="mb-1"><strong>Price:</strong> ₹{{ item.price }}</p>
          <p class="mb-1"><strong>Stock:</strong> {{ item.stock > 0 ? item.stock : 'Out of Stock' }}</p>
          <p class="mb-1"><strong>GSM:</strong> {{ item.gsm }}</p>
          <p class="mb-1"><strong>Pack:</strong> {{ item.packSize }}</p>

          <div class="d-flex justify-content-between mt-2">
            <button class="btn btn-warning btn-sm" (click)="onEdit(item)">Edit</button>
            <button class="btn btn-danger btn-sm" (click)="onDelete(item.id!)">Delete</button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
