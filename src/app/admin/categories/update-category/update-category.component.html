<div class="container-fluid">
  <h2 class="text-center fw-semibold">All Categories</h2>
  <div class="text-end mb-3 border-bottom">
        <a class="text-white text-decoration-none btn btn-info btn-custom fw-bold mb-2"
        routerLink="/home"><i class="fas fa-globe"></i>Customer Site</a>
  </div>

  <div class="row">
    @for (category of categories; track category.id) {
    <div class="col-md-3 mb-4" >
      <div class="card  category-card animate__animated animate__fadeInUp" style="height: 450px;">
        <img [src]="category.imageUrl || 'assets/images/no-image.png'"
          class="card-img-top category-img"
          alt="Category Image" style="height: 30%;" />

        <div class="card-body d-flex flex-column">
          <h5 class="card-title fw-bold">{{ category.name }}</h5>
          <p><strong>Description:</strong> {{ category.description }}</p>
          <p><strong>Price:</strong> ₹{{ category.price }}</p>
          <p><strong>Company:</strong> {{ category.company }}</p>
          <p><strong>Warranty:</strong> {{ category.warranty }} months</p>
          <p><strong>Created At:</strong> {{ category.createdAt | date }}</p>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between">
          <button class="btn btn-warning btn-sm"
            [routerLink]="['/admin/edit-category',category.id]">Edit</button>
          <button class="btn btn-danger btn-sm"
            (click)="deleteCategory(category.id)">Delete</button>
        </div>
      </div>
    </div>
    }
  </div>
</div>
