
<div class="container-fluid mt-5">
  <h2 class="text-center mb-4">User Registration</h2>

  <form #registerForm="ngForm" (ngSubmit)="submit()"
    class="border p-4 rounded bg-light">

    <div class="row">

      <div class="col-md-6 mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control"
          [(ngModel)]="user.name" name="name"
          required placeholder="Enter full name">
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control"
          [(ngModel)]="user.email" name="email"
          required placeholder="Enter email">
      </div>
    </div>

    <div class="row">

      <div class="col-md-6 mb-3">
        <label class="form-label">Phone Number</label>
        <input type="text" class="form-control"
          [(ngModel)]="user.phone" name="phone"
          required placeholder="Enter phone number">
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Address</label>
        <textarea class="form-control" rows="1"
          [(ngModel)]="user.address" name="address"
          required placeholder="Enter address"></textarea>
      </div>
    </div>

    <div class="row">

      <div class="col-md-6 mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control"
          [(ngModel)]="user.password" name="password"
          required placeholder="Enter password">
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control"
          [(ngModel)]="confirmPassword" name="confirmPassword"
          required placeholder="Confirm password">
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100"
      [disabled]="!registerForm.valid || user.password !== confirmPassword">
      Register
    </button>
    
    <p class="mt-3 text-center">
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>

  </form>
</div>
